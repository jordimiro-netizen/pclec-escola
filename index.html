<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCLEC · Escola Sant Jeroni</title>
<style>
:root{--magenta:#a32268;--turquesa:#39a9ae;--fons:#f7f7f7;--text:#343434}*{box-sizing:border-box}body{margin:0;font:15px Arial,Helvetica,sans-serif;color:var(--text);background:var(--fons)}header{background:var(--magenta);color:white;padding:17px max(24px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px}.marca{font-size:25px;font-weight:bold;letter-spacing:1px}.sub{font-size:12px;opacity:.9}header button{background:transparent;border:1px solid #fff;color:white;border-radius:3px;padding:8px 12px;cursor:pointer}main{max-width:1100px;margin:34px auto;padding:0 20px;min-height:calc(100vh - 180px)}h1{font-size:24px;font-weight:normal;margin:0 0 22px}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.tile{background:white;border:1px solid #ddd;min-height:135px;padding:20px 8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;cursor:pointer;color:#444;box-shadow:0 1px 2px #0000000a}.tile:hover,.tile.active{border-color:var(--magenta);color:var(--magenta)}.tile .ico{font-size:36px}.panel{margin-top:25px;background:white;border:1px solid #ddd;padding:24px;min-height:160px}h2{font-size:20px;margin:0 0 16px;color:var(--magenta);font-weight:normal}.notice{background:#f7f3f5;border-left:4px solid var(--magenta);padding:13px 16px;line-height:1.6}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}input,select{padding:9px;border:1px solid #ccc;border-radius:2px;min-width:140px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e5e5}th{background:#f2f2f2;font-weight:600}.tag{font-size:12px;background:#e7f4f4;padding:4px 8px;border-radius:3px}footer{background:var(--turquesa);color:white;text-align:center;padding:18px;margin-top:35px}small{color:#666}button:focus-visible{outline:3px solid #222;outline-offset:2px}@media(max-width:600px){header{padding:15px 20px}.marca{font-size:21px}.menu{grid-template-columns:repeat(2,1fr)}.panel{padding:15px}table{font-size:13px}}
</style>
</head>
<body>
<header><div><div class="marca">PCLEC</div><div class="sub">Escola Sant Jeroni · Entorn de demostració</div></div><button id="home">Inici</button></header>
<main><h1>Panell de gestió</h1><nav class="menu" aria-label="Mòduls principals" id="menu"></nav><section class="panel" id="panel" aria-live="polite"></section></main>
<footer>PCLEC · Escola Sant Jeroni · Prototip sense dades reals</footer>
<script>
const sections=[['👥','Gestió d’usuaris'],['📖','Llistat de proves'],['📋','Assignació de proves'],['✏️','Correcció'],['📊','Resultats'],['🕘','Històric'],['❔','Ajuda']];
const menu=document.getElementById('menu'),panel=document.getElementById('panel');let active=-1;
const fake=[{nom:'Alumna Exemple',nivell:'6è',grup:'A'},{nom:'Alumne Demostració',nivell:'5è',grup:'A'}];
function render(i=-1){active=i;menu.innerHTML='';sections.forEach(([ico,label],n)=>{const b=document.createElement('button');b.className='tile'+(i===n?' active':'');b.innerHTML=`<span class="ico" aria-hidden="true">${ico}</span><span>${label}</span>`;b.onclick=()=>render(n);menu.appendChild(b)});if(i<0){panel.innerHTML='<h2>Benvinguda / Benvingut</h2><div class="notice">Aquesta és la primera versió de la plataforma pròpia. Pots entrar als apartats del menú per comprovar-ne l’estructura. Encara no es poden fer proves ni desar resultats.</div>';return}let html=`<h2>${sections[i][1]}</h2>`;if(i===0){html+='<div class="filters"><input id="search" placeholder="Cerca alumne/a" aria-label="Cerca alumne/a"><select id="level"><option value="">Tots els nivells</option><option>5è</option><option>6è</option></select></div><table><thead><tr><th>Nom</th><th>Nivell</th><th>Grup</th></tr></thead><tbody id="students"></tbody></table><p><small>Alumnat fictici de demostració.</small></p>'}else if(i===1){html+='<p>Catàleg preparat per als models A, B, C, D, E i F en català, castellà i anglès.</p><div class="notice">Pendent d’incorporar els materials originals autoritzats.</div>'}else if(i===2){html+='<div class="notice">Aplicació 1 i Aplicació 2: dos moments d’avaluació dins del mateix curs escolar. No hi ha proves assignades.</div>'}else if(i===3){html+='<div class="notice">No hi ha proves pendents de correcció.</div>'}else if(i===4){html+='<div class="filters"><select><option>Comparativa</option><option>Aplicació 1</option><option>Aplicació 2</option></select><select><option>Globals</option><option>Per processos</option></select></div><div class="notice">Encara no hi ha resultats. Aquí apareixeran els gràfics i els informes.</div>'}else if(i===5){html+='<div class="notice">L’històric conservarà els resultats per curs escolar, alumne/a i aplicació.</div>'}else{html+='<p>Ajuda i instruccions de la plataforma. Secció pendent de completar.</p>'}panel.innerHTML=html;if(i===0){const update=()=>{const q=document.getElementById('search').value.toLowerCase(),level=document.getElementById('level').value;document.getElementById('students').innerHTML=fake.filter(x=>x.nom.toLowerCase().includes(q)&&(!level||x.nivell===level)).map(x=>`<tr><td>${x.nom}</td><td>${x.nivell}</td><td>${x.grup}</td></tr>`).join('')||'<tr><td colspan="3">Sense coincidències</td></tr>'};document.getElementById('search').oninput=update;document.getElementById('level').onchange=update;update()}}
document.getElementById('home').onclick=()=>render();render();
</script>
</body>
</html>
